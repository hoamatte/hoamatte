<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lễ Hằng Thuận - Matteo ♡ Hoà </title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="pagoda_x4.png">
</head>
<body>

<div class="stage-container">
  <div class="stage" id="stage">
    <div class="background-image"></div>
    <div class="gate-door gate-left" id="gateLeft"></div>
    <div class="gate-door gate-right" id="gateRight"></div>
    <div class="bird" id="bird">
      <div class="bird-sprite"></div>
    </div>
	<div class="flying-letter-bird" id="flyingBird">
	  <div class="letter-bird-sprite"></div>
	</div>
    <div class="character character-left" id="charLeft">
      <div class="sprite"></div>
    </div>
    <div class="character character-right" id="charRight">
      <div class="sprite"></div>
    </div>

	<div class="final-title" id="finalTitle"></div> <!-->Chào mừng! Benvenuti!<!-->
	</div>
</div>

  <script src="script.js" defer></script>
</body>
</html>
