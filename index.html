
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiệp Việt Nam</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  background:#173b32; color:#ffe8ad; font-family:Georgia,serif;
  text-align:center; padding:20px;
}
.card{
  max-width:480px;width:100%;padding:28px 22px;
  border:3px double #d9ad58;border-radius:180px 180px 18px 18px;
  background:linear-gradient(#722b25dd,#241f19ed),
  url('https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=900&q=80') center/cover;
  box-shadow:0 0 35px #0008;
}
h1{font-size:34px;color:#ffd778;margin:15px 0}
p{line-height:1.9}
.lotus{font-size:48px}
button{
  padding:12px 24px;border:1px solid #f8d987;
  border-radius:25px;background:#d9ad58;color:#54251c;
  font-size:16px;cursor:pointer;
}
#message{display:none;animation:fade 1s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:translateY(0)}}
footer{font-size:12px;margin-top:24px;color:#e7d4a3}
</style>
</head>
<body>
<main class="card">
  <div class="lotus">🪷</div>
  <p>☸ NAM MÔ A DI ĐÀ PHẬT ☸</p>
  <h1>Thiệp Chúc Mừng</h1>
  <p>Kính chúc bạn và gia đình</p>
  <p><strong>An nhiên – Hạnh phúc – Bình an</strong></p>
  <p>Nguyện cầu mọi điều tốt đẹp,<br>
  tâm luôn thanh tịnh, đời luôn an vui.</p>

  <button onclick="openCard()">Mở lời chúc ✨</button>
  <p id="message">
    🏮 Tâm sáng như sen, lòng an như nước.<br>
    Chúc bạn luôn gặp duyên lành và vạn sự hanh thông!
  </p>
  <footer>✦ Một chút bình yên mang hồn Việt ✦</footer>
</main>
<script>
function openCard(){
  document.getElementById('message').style.display='block';
}
</script>
</body>
</html>
